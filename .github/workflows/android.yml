
name: Compilar APK Plato Divisor Horizontal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Preparar aplicacion
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icono.png www/icono.png
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.habitarpleno.platodivisorhorizontal",
            "appName": "Plato Divisor Horizontal",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/' android/variables.gradle

      - name: Generar iconos Android
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          import os

          img = Image.open("icono.png").convert("RGBA")
          base = "android/app/src/main/res"

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = os.path.join(base, "mipmap-" + density)
              os.makedirs(folder, exist_ok=True)

              icon = img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(os.path.join(folder, "ic_launcher.png"))
              icon.save(os.path.join(folder, "ic_launcher_round.png"))
              icon.save(os.path.join(folder, "ic_launcher_foreground.png"))

          # Eliminar los iconos adaptativos predeterminados
          # para que Android utilice nuestros PNG.
          for folder in ["mipmap-anydpi", "mipmap-anydpi-v26"]:
              path = os.path.join(base, folder)
              for filename in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                  file = os.path.join(path, filename)
                  if os.path.exists(file):
                      os.remove(file)

          # Reemplazar el icono de la pantalla de inicio.
          drawable = os.path.join(base, "drawable")
          os.makedirs(drawable, exist_ok=True)

          splash = img.resize((288, 288), Image.Resampling.LANCZOS)
          splash.save(os.path.join(drawable, "splash_icon.png"))

          # Reemplazar el icono de Android 12+.
          values = os.path.join(base, "values")
          os.makedirs(values, exist_ok=True)

          with open(os.path.join(values, "styles.xml"), "r") as f:
              content = f.read()

          content = content.replace(
              "@drawable/splash",
              "@drawable/splash_icon"
          )

          with open(os.path.join(values, "styles.xml"), "w") as f:
              f.write(content)

          # Ajustar el recurso de pantalla inicial si existe.
          for folder in ["values-v31", "values"]:
              styles = os.path.join(base, folder, "styles.xml")
              if os.path.exists(styles):
                  with open(styles, "r") as f:
                      data = f.read()
                  data = data.replace(
                      "@drawable/splash",
                      "@drawable/splash_icon"
                  )
                  with open(styles, "w") as f:
                      f.write(data)
          PY

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Plato_Divisor_Horizontal_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
