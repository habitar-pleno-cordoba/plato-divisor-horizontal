
name: Compilar APK Plato Divisor Horizontal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Preparar aplicacion
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icono.png www/icono.png
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.habitarpleno.platodivisorhorizontal",
            "appName": "Plato Divisor Horizontal",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Incorporar icono
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          import os

          img = Image.open("icono.png").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          base = "android/app/src/main/res"
          for folder, size in sizes.items():
              path = os.path.join(base, folder)
              os.makedirs(path, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              for name in ["ic_launcher.png", "ic_launcher_round.png"]:
                  resized.save(os.path.join(path, name))
          PY

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Plato_Divisor_Horizontal_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
